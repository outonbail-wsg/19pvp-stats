<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warsong Gulch stats — 19pvp</title>
<style>
  :root{
    --surface:#fcfcfb; --page:#f4f4f1; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --accent:#2a78d6; --accent-soft:#dceafb;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
       font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 18px 80px}
  h1{font-size:26px;margin:0 0 4px}
  h2{font-size:19px;margin:38px 0 12px}
  .sub{color:var(--ink2);margin:0 0 22px}
  .muted{color:var(--muted);font-size:13px}
  .card{background:var(--surface);border:1px solid var(--grid);
        border-radius:var(--radius);padding:20px;margin-bottom:18px}

  /* ---- search ---- */
  .search{display:flex;gap:10px;flex-wrap:wrap}
  input[type=search]{flex:1;min-width:220px;padding:11px 13px;font-size:16px;
    border:1px solid var(--axis);border-radius:8px;background:var(--surface);color:var(--ink)}
  input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  button{padding:11px 18px;font-size:15px;border:0;border-radius:8px;
    background:var(--accent);color:#fff;cursor:pointer}
  button:hover{background:#1c5cab}
  .hits{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .hit{border:1px solid var(--grid);background:var(--surface);color:var(--ink);
       padding:5px 10px;border-radius:999px;cursor:pointer;font-size:13px}
  .hit:hover{border-color:var(--accent)}

  /* ---- player card ---- */
  .who{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:2px}
  .views{display:flex;gap:8px;margin:0 0 20px;border-bottom:1px solid var(--grid)}
  .views button{border:0;border-bottom:2px solid transparent;background:none;
                color:var(--ink2);padding:8px 2px;margin-right:16px;font-size:15px;
                font-family:inherit;cursor:pointer}
  .views button:hover{color:var(--ink)}
  .views button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  .units{display:flex;gap:6px;margin:0 0 12px}
  .units button{border:1px solid var(--grid);background:var(--surface);color:var(--ink2);
                border-radius:999px;padding:4px 11px;font-size:12.5px;
                font-family:inherit;cursor:pointer}
  .units button.on{border-color:var(--accent);color:var(--accent);
                   background:var(--accent-soft)}
  h1 #home{all:unset;cursor:pointer;display:inline-block}
  h1 #home:hover{color:var(--accent)}
  .closecard{margin-left:auto;border:1px solid var(--grid);background:var(--surface);
             color:var(--ink2);border-radius:999px;padding:5px 13px;font-size:12.5px;
             font-family:inherit;cursor:pointer;align-self:center}
  .closecard:hover{border-color:var(--accent);color:var(--accent)}
  .who .nm{font-size:27px;font-weight:600}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
         gap:14px;margin:18px 0 6px}
  .tile .v{font-size:25px;font-weight:600;line-height:1.1}
  .tile .k{font-size:12.5px;color:var(--ink2)}
  .tile .s{font-size:11.5px;color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--grid)}
  th{color:var(--ink2);font-weight:600;font-size:12.5px}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{position:relative;background:var(--accent-soft);border-radius:4px;height:16px;min-width:2px}
  .bar>span{position:absolute;inset:0;background:var(--accent);border-radius:4px}
  .barcell{width:38%}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:720px){.split{grid-template-columns:1fr}}

  /* ---- form strip: one box per match, newest last ---- */
  .form{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 2px}
  .form b{width:20px;height:20px;border-radius:4px;font:600 11px/20px system-ui;
          text-align:center;color:#fff}
  .form b.w{background:#1baf7a} .form b.l{background:#e34948}
  .form b.d{background:#898781}
  .streak{font-size:13px;color:var(--ink2);margin-top:2px}

  /* ---- game log ---- */
  .logwrap{max-height:420px;overflow:auto;margin-top:4px}
  .logwrap table{font-size:13px}
  .logwrap thead th{position:sticky;top:0;background:var(--surface);
                    border-bottom:1px solid var(--axis);cursor:pointer;white-space:nowrap}
  .logwrap thead th:hover{color:var(--accent)}
  .res{font-weight:600} .res.w{color:#0f7f57} .res.l{color:#b8332f}
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;
        background:var(--accent-soft);color:#1c5cab}

  /* ---- lobby switch ---- */
  .switch{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:14px;
          color:var(--ink2);cursor:pointer;user-select:none}
  .switch input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
  .scope{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;
         font-size:12px;background:var(--accent-soft);color:#1c5cab;vertical-align:2px}

  /* ---- lightbox ---- */
  .lb{position:fixed;inset:0;background:rgba(11,11,11,.92);z-index:50;
      display:flex;flex-direction:column;align-items:center;justify-content:center}
  .lb img{max-width:94vw;max-height:84vh;object-fit:contain;background:var(--surface);
          border-radius:6px}
  .lb .cap{color:#e8e8e4;font-size:14px;margin-top:12px;max-width:900px;
           text-align:center;line-height:1.5}
  .lb .cap span{display:block;margin-top:4px;color:#b9b9b3;font-size:13px}
  .lb .cap b{color:#fff;font-weight:600}
  .lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;
             border:0;border-radius:8px;font-size:26px;line-height:1;
             padding:14px 18px;cursor:pointer}
  .lb button:hover{background:rgba(255,255,255,.24)}
  .lb .prev{left:2vw} .lb .next{right:2vw}
  .lb .close{top:2vh;right:2vw;font-size:20px;padding:9px 14px}
  @media(max-width:640px){.lb button{font-size:20px;padding:10px 13px}}

  /* ---- chart gallery ---- */
  .galnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
  .galnav button{border:1px solid var(--grid);background:var(--surface);
                 color:var(--ink2);border-radius:999px;padding:5px 12px;
                 font-size:12.5px;font-family:inherit;cursor:pointer}
  .galnav button:hover{border-color:var(--accent);color:var(--accent)}
  .gal section{margin-bottom:32px;scroll-margin-top:16px}
  .gal h3{font-size:15px;margin:0 0 2px;color:var(--ink)}
  .gal section > .muted{font-size:12.5px;margin:0 0 12px}
  .gal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
            gap:14px}
  .gal figure{margin:0;background:var(--surface);border:1px solid var(--grid);
              border-radius:var(--radius);overflow:hidden}
  .gal img{width:100%;display:block;background:var(--surface)}
  .gal figcaption{padding:10px 12px 12px}
  .gal figcaption b{display:block;font-size:14px;font-weight:600;color:var(--ink)}
  .gal figcaption span{display:block;margin-top:3px;font-size:12.5px;line-height:1.45;
                       color:var(--ink2)}
  .gal a{text-decoration:none;color:inherit}
  .caveat{margin:16px 0 0;padding:10px 13px;border-left:3px solid var(--axis);
          background:var(--page);border-radius:0 6px 6px 0;font-size:13px;
          line-height:1.5;color:var(--ink2)}
  .caveat b{color:var(--ink)}
  details summary{cursor:pointer;font-size:15px;color:var(--accent);margin-bottom:12px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <h1><button type="button" id="home">Warsong Gulch stats</button></h1>
  <p class="sub" id="period"></p>
  <nav class="views" id="viewnav"></nav>

  <div class="card">
    <div class="search">
      <input type="search" id="q" placeholder="Type a character name…" autocomplete="off"
             aria-label="Character name">
      <button id="go">Show stats</button>
    </div>
    <div class="hits" id="hits"></div>
    <div class="units" id="scopeBar" style="margin:14px 0 0"></div>
    <label class="switch">
      <input type="checkbox" id="allLobbies">
      <span>Include lobbies the bots filled</span>
    </label>
    <p class="muted" id="searchNote" style="margin:10px 0 0"></p>
  </div>

  <div id="card" class="hidden"></div>

  <h2>Server report</h2>
  <p class="sub">Every chart from the full analysis, regenerated with the data above.</p>
  <p class="muted" id="galScope" style="margin:-8px 0 16px"></p>
  <nav class="galnav" id="galnav"></nav>
  <div class="gal" id="gal"></div>

  <p class="muted" id="foot" style="margin-top:34px"></p>
</div>

<script id="payload" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("payload").textContent);
const META = DATA.meta;
const SEC = new Set(DATA.secondsStats);
const LBL = DATA.statLabels;

/* Contested lobbies are the default view: a match the bots had to fill is not
   the game most people mean when they compare themselves to others. The switch
   brings the rest back. P, QUAL and the chart list all follow it. */
const HAS_CONTESTED = (DATA.playersContested || []).length > 0;
let allLobbies = false;
let P = [], QUAL = [], CHARTS = [], VIEWS = [];
function applyScope(){
  const contested = HAS_CONTESTED && !allLobbies;
  const base = contested ? DATA.playersContested : DATA.players;
  LAST_TS = lastTs(contested);
  const cut = scopeCut();
  if (cut == null) P = base;
  else P = base.map(p => {
    const rows = (DATA.log[p.id] || DATA.log[String(p.id)] || [])
      .filter(r => r[LF.at] >= cut && (!contested || r[LF.contested]));
    return rows.length ? scopedRecord(p, rows) : null;
  }).filter(Boolean).sort((a, b) => b.games - a.games);
  QUAL = P.filter(p => p.games >= scopeMin());
  CHARTS = contested && DATA.chartsContested.length
         ? DATA.chartsContested : DATA.charts;
  VIEWS = (contested && DATA.chartsContested.length
        ? DATA.chartViewsContested : DATA.chartViews) || [];
}

/* ---------- formatting ---------- */
const nf = new Intl.NumberFormat("en-US");
const fmt = v => v == null ? "–" : nf.format(Math.round(v));
const pct = v => v == null ? "–" : (v * 100).toFixed(0) + " %";
const dur = s => { if (s == null) return "–"; s = Math.round(s);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`
           : `${m}:${String(x).padStart(2,"0")}`; };
const statVal = (k, v) => SEC.has(k) ? dur(v) : fmt(v);
const classColor = c => DATA.classColors[c] || "#c9c8c2";

/* Darken a class colour until it is readable as text on a light surface,
   the same rule the PNG charts use. */
function readable(hex){
  const rgb = [1,3,5].map(i => parseInt(hex.slice(i,i+2),16)/255);
  const lum = c => { const l = c<=0.04045 ? c/12.92 : ((c+0.055)/1.055)**2.4; return l; };
  const L = a => 0.2126*lum(a[0]) + 0.7152*lum(a[1]) + 0.0722*lum(a[2]);
  for (let f=1; f>0.05; f-=0.04){
    const c = rgb.map(v => v*f);
    if ((1.05) / (L(c)+0.05) >= 4.5)
      return "#" + c.map(v => Math.round(v*255).toString(16).padStart(2,"0")).join("");
  }
  return "#0b0b0b";
}

/* ---------- ranking helpers ---------- */
function rankOf(player, get, pool){
  const mine = get(player);
  if (mine == null) return null;
  // A character below the match threshold still gets a placing - it is their own
  // profile and the placing is the point of it - but they are added to the pool
  // rather than measured against one they are not part of. Measuring against it
  // would report "#1 of 47" for someone who is none of the 47.
  const provisional = !pool.some(x => x.id === player.id);
  const vals = pool.map(get).filter(v => v != null);
  if (provisional) vals.push(mine);
  if (!vals.length) return null;
  const better = vals.filter(v => v > mine).length;
  return {rank: better + 1, of: vals.length, provisional,
          pctile: vals.filter(v => v <= mine).length / vals.length};
}
const rankText = r => r ? `#${r.rank} of ${r.of}${r.provisional ? " · provisional" : ""}`
                        : "–";
/* Ranking a rogue's healing against priests is meaningless. Where a class has
   enough qualified characters, rank inside it as well. */
const MIN_CLASS_POOL = 8;
const classPool = c => QUAL.filter(p => p.class === c);

/* ---------- time scopes ----------
   The whole match log is already in the payload, so a "today" or "last 7 days"
   view is a re-aggregation of rows the page holds rather than a second and
   third set of pre-computed totals. Elo, rivals and team mates cannot be
   rebuilt this way - they need the opposing side of every match - so a scoped
   view drops those panels instead of showing an all-time number under a
   short-window heading. */
const SCOPES = [
  {id: "all",   label: "All time",    days: null},
  {id: "week",  label: "Last 7 days", days: 7,  min: 5},
  {id: "today", label: "Today",       days: 1,  min: 3},
];
let scope = "all";
const scopeDef = () => SCOPES.find(x => x.id === scope) || SCOPES[0];
// A short window cannot clear the full match threshold, so it carries a lower
// one. Ranking three days of play against a 10-match bar would empty the pool.
const scopeMin = () => scopeDef().min ?? META.minGames;

/* ---------- game log ---------- */
const LF = {};
DATA.logFields.forEach((f, i) => LF[f] = i);
function logOf(p){
  const rows = DATA.log[p.id] || DATA.log[String(p.id)] || [];
  return (HAS_CONTESTED && !allLobbies) ? rows.filter(r => r[LF.contested]) : rows;
}
// Windows are anchored on the newest match in the data, not on the reader's
// clock: a build from this morning would otherwise show an empty "today" all
// evening. The note under the switch states the dates it actually covers.
const DAY = 86400;
// The anchor has to follow the lobby filter, not the raw data: contested play
// can end a day earlier than bot-filled play, and anchoring on the latter gives
// a "Today" with nothing in it.
let LAST_TS = 0;
function lastTs(contested){
  let mx = 0;
  for (const rows of Object.values(DATA.log))
    for (let i = rows.length - 1; i >= 0; i--)
      if (!contested || rows[i][LF.contested]){
        if (rows[i][LF.at] > mx) mx = rows[i][LF.at];
        break;
      }
  return mx;
}
// A one-day window has one date, not the same one twice.
const dateRange = (a, b) => dateOf(a) === dateOf(b)
  ? dateOf(a) : `${dateOf(a)} – ${dateOf(b)}`;
function scopeCut(){
  const d = scopeDef().days;
  if (d == null || !LAST_TS) return null;
  const dayStart = Math.floor(LAST_TS / DAY) * DAY;   // UTC midnight of that day
  return dayStart - (d - 1) * DAY;
}

const SUMKEYS = Object.keys(DATA.players[0]?.sum || {});

/* Rebuild one character's record from the rows inside the window. Same shape as
   the pre-computed record, with the fields that need cross-match context left
   null so the card can hide those panels rather than mislabel them. */
function scopedRecord(p, rows){
  const sum = {}, best = {}, days = new Set();
  let wins = 0, decided = 0, secs = 0, deserts = 0;
  let run = 0, bestWin = 0, bestLoss = 0;
  for (const k of SUMKEYS){ sum[k] = 0; best[k] = 0; }
  for (const r of rows){
    secs += r[LF.seconds];
    days.add(Math.floor(r[LF.at] / DAY));
    if (r[LF.deserted]) deserts++;
    const res = r[LF.win];
    if (res !== 0){
      decided++;
      if (res === 1){ wins++; run = run > 0 ? run + 1 : 1; bestWin = Math.max(bestWin, run); }
      else { run = run < 0 ? run - 1 : -1; bestLoss = Math.max(bestLoss, -run); }
    }
    for (const k of SUMKEYS){
      const v = r[LF[k]] || 0;
      sum[k] += v;
      if (v > best[k]) best[k] = v;
    }
  }
  const minutes = secs / 60, pm = {};
  for (const k of SUMKEYS) pm[k] = minutes ? sum[k] / minutes : null;
  return {
    ...p, games: rows.length, decided, wins, minutes,
    winrate: decided ? wins / decided : null,
    days: days.size, sum, pm, best,
    kd: sum.deaths ? sum.killingBlows / sum.deaths : null,
    takenPerDeath: sum.deaths ? sum.damageTaken / sum.deaths : null,
    capRate: sum.attemptsOnFlag ? sum.flagCaptures / sum.attemptsOnFlag : null,
    desertRate: rows.length ? deserts / rows.length : null,
    firstSeen: dateOf(rows[0][LF.at]), lastSeen: dateOf(rows[rows.length - 1][LF.at]),
    streak: run, bestWin, bestLoss,
    objDamage: sum.damageDone ? sum.damageOnEFC / sum.damageDone : null,
    objHealing: sum.healingDone ? sum.healsOnFC / sum.healingDone : null,
    elo: null, rivals: [], allies: [], scoped: true,
  };
}

// UTC, like the windows are computed and like every chart footnote says. Reading
// a UTC midnight in the browser's own zone put the wrong day on the label.
const dateOf = sec => new Date(sec * 1000)
  .toLocaleDateString("en-GB", {day:"2-digit", month:"short", timeZone:"UTC"});

/* ---------- search ---------- */
const q = document.getElementById("q"), hits = document.getElementById("hits");
function updateNote(){
  const scope = (HAS_CONTESTED && !allLobbies)
    ? `Contested lobbies only — both teams fielded ${META.contestedPerTeam}+ real `
      + `players. Tick the box above to include the rest.`
    : `All lobbies, including those the bots filled.`;
  document.getElementById("searchNote").textContent =
    `${scope} ${P.length} characters in view; averages and ranks use the `
    + `${QUAL.length} with at least ${scopeMin()} matches.`
    + (scopeCut() == null ? ""
       : ` ${scopeDef().label}: ${dateRange(scopeCut(), LAST_TS)}.`);
}

function matches(term){
  term = term.trim().toLowerCase();
  if (!term) return [];
  return P.filter(p => p.name.toLowerCase().includes(term)).slice(0, 12);
}
function renderHits(){
  const list = matches(q.value);
  hits.innerHTML = "";
  if (list.length === 1 && list[0].name.toLowerCase() === q.value.trim().toLowerCase()){
    openPlayer(list[0]); return;
  }
  list.forEach(p => {
    const b = document.createElement("button");
    b.className = "hit"; b.textContent = `${p.name} · ${p.class || "?"} · ${p.games} matches`;
    b.style.color = readable(classColor(p.class));
    b.onclick = () => { q.value = p.name; hits.innerHTML = ""; openPlayer(p); };
    hits.appendChild(b);
  });
}
q.addEventListener("input", renderHits);
q.addEventListener("keydown", e => { if (e.key === "Enter"){ const l = matches(q.value);
  if (l.length){ q.value = l[0].name; hits.innerHTML = ""; openPlayer(l[0]); } } });
document.getElementById("go").onclick = () => { const l = matches(q.value);
  if (l.length){ q.value = l[0].name; hits.innerHTML = ""; show(l[0]); } };

/* ---------- the player card ---------- */
/* Rates can be read three ways. Per hour is per minute times sixty, so it ranks
   identically; per game is a different quantity and a different order, because
   someone who plays short rounds looks better by the minute than by the game. */
const UNITS = [["pm", "per minute", 1], ["ph", "per hour", 60], ["pg", "per game", null]];
let unit = "pm";
const unitFactor = () => (UNITS.find(u => u[0] === unit) || UNITS[0])[2];
const rateOf = (x, k) => {
  const f = unitFactor();
  if (f == null) return x.games ? (x.sum[k] ?? null) / x.games : null;
  const v = x.pm[k];
  return v == null ? null : v * f;
};

const RANKED = ["damageDone","healingDone","damageOnEFC","healsOnFC",
                "flagReturns","flagCaptures","flagCarryTime","attemptsOnFlag",
                "killingBlows","honorableKills","deaths","damageTaken","absorbsDone",
                "successfulInterrupts","fakeCastInterrupts","hardCCDuration",
                "softCCDuration","dispelsOffensive","dispelsDefensive"];

/* Profile shape. Short labels: eight full stat names will not fit around a
   radar, so the key underneath spells them out. */
const PROFILE = [
  ["damageDone","DMG"], ["damageOnEFC","on EFC"], ["killingBlows","KB"],
  ["flagCarryTime","Carry"], ["flagReturns","Returns"], ["healsOnFC","Heal FC"],
  ["healingDone","HPS"], ["absorbsDone","Absorb"],
];
const PROFILE_KEY = "DMG = damage done · on EFC = damage on the enemy flag carrier · "
  + "KB = killing blows · Carry = flag carry time · Returns = flag returns · "
  + "Heal FC = healing on own flag carrier · HPS = healing done · Absorb = absorbs done";

/* Radar drawn straight as SVG - no chart library, so the page stays one file.
   Axes are percentiles, never absolute values: the enclosed area means nothing,
   each spoke is read on its own. */
function radarSVG(dims, color, size){
  const cx = size/2, cy = size/2, R = size/2 - 42, n = dims.length;
  const at = (i, f) => {
    const a = -Math.PI/2 + i * 2*Math.PI/n;
    return [cx + Math.cos(a)*R*f, cy + Math.sin(a)*R*f, a];
  };
  const rings = [0.25,0.5,0.75,1].map(f =>
    `<polygon points="${dims.map((_,i)=>at(i,f).slice(0,2).join(",")).join(" ")}"
       fill="none" stroke="var(--grid)" stroke-width="1"/>`).join("");
  const spokes = dims.map((_,i) => {
    const [x,y] = at(i,1);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--grid)"/>`;
  }).join("");
  const pts = dims.map((d,i) => at(i, d.p).slice(0,2));
  const labels = dims.map((d,i) => {
    const [x,y,a] = at(i, 1);
    const lx = cx + Math.cos(a)*(R+16), ly = cy + Math.sin(a)*(R+16);
    const anchor = Math.abs(Math.cos(a)) < 0.25 ? "middle"
                 : (Math.cos(a) > 0 ? "start" : "end");
    return `<text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle"
              font-size="11" fill="var(--ink2)">${d.label}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="100%"
            style="max-width:${size}px;display:block;margin:0 auto"
            role="img" aria-label="performance profile">
    ${rings}${spokes}
    <polygon points="${pts.map(p=>p.join(",")).join(" ")}"
             fill="${color}" fill-opacity="0.18" stroke="${color}" stroke-width="2"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${color}"/>`).join("")}
    ${labels}</svg>`;
}

function show(p){
  const el = document.getElementById("card");
  const col = readable(classColor(p.class));
  const wrRank = rankOf(p, x => x.winrate, QUAL.filter(x => x.decided >= scopeMin()));

  const eloRank = rankOf(p, x => x.elo, QUAL);
  const tiles = [
    [p.games, "matches played", `${p.days} day${p.days===1?"":"s"} active`],
    [pct(p.winrate), "win rate", rankText(wrRank)],
    [p.elo != null ? Math.round(p.elo) : "–", "power rating",
     p.scoped ? "all-time only" : rankText(eloRank)],
    [fmt(p.sum.flagCaptures), "flag captures",
     p.capRate != null ? pct(p.capRate) + " of pickups" : ""],
    [fmt(p.sum.flagReturns), "flag returns", ""],
    [dur(p.sum.flagCarryTime), "flag carried", ""],
    [p.kd != null ? p.kd.toFixed(2) : "–", "kills per death",
     `${fmt(p.sum.killingBlows)} / ${fmt(p.sum.deaths)}`],
    [Math.round(p.minutes/60) + " h", "time played",
     `${p.firstSeen} – ${p.lastSeen}`],
  ];

  /* form: the last 20 results, oldest left */
  const log = logOf(p);
  const recent = log.slice(-20);
  const formHTML = recent.map(r => {
    const v = r[LF.win];
    return `<b class="${v>0?"w":v<0?"l":"d"}" title="${dateOf(r[LF.at])}">`
         + `${v>0?"W":v<0?"L":"D"}</b>`;
  }).join("");
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const streakTxt = p.streak > 0 ? plural(p.streak, "win", "wins") + " in a row"
                  : p.streak < 0 ? plural(-p.streak, "loss", "losses") + " in a row"
                  : "no current run";

  const provisional = !QUAL.some(x => x.id === p.id);
  const pool = classPool(p.class);
  const useClass = pool.length >= MIN_CLASS_POOL;
  const rows = RANKED.map(k => {
    const r = rankOf(p, x => rateOf(x, k), QUAL);
    const rc = useClass ? rankOf(p, x => rateOf(x, k), pool) : null;
    return {k, v: rateOf(p, k), r, rc};
  }).filter(r => r.v != null).sort((a, b) => (b.r?.pctile || 0) - (a.r?.pctile || 0));

  const bests = Object.entries(p.best).filter(([,v]) => v);
  const profile = PROFILE.map(([k, label]) => ({
    label, p: rankOf(p, x => x.pm[k], QUAL)?.pctile || 0}));

  el.innerHTML = `
    <div class="card">
      <div class="who">
        <span class="nm" style="color:${col}">${p.name}</span>
        <span class="muted">${p.class || "class unknown"}</span>
        <span class="scope">${(HAS_CONTESTED && !allLobbies)
          ? "contested lobbies" : "all lobbies"}</span>
        <button class="closecard" id="closeCard" type="button">Close ✕</button>
      </div>
      <div class="tiles">
        ${tiles.map(([v,k,s]) => `<div class="tile"><div class="v">${v}</div>
          <div class="k">${k}</div><div class="s">${s}</div></div>`).join("")}
      </div>
      ${provisional ? `<p class="caveat"><b>Provisional ranking.</b> Placings on
        this page compare characters with ${scopeMin()}+ matches. ${p.name} has
        ${plural(p.games, "match", "matches")} and is placed into that pool anyway,
        so the ranks below are shown but not settled: over so few matches a couple
        of good or bad rounds move a rate a long way, and a high placing here rests
        on a small sample. It firms up at ${scopeMin()} matches.</p>` : ""}
      <h2 style="font-size:15px;margin:22px 0 0">Form — last ${recent.length} matches</h2>
      <div class="form">${formHTML}</div>
      <div class="streak">${streakTxt} · best run ${plural(p.bestWin||0, "win", "wins")},
        worst ${plural(p.bestLoss||0, "loss", "losses")}</div>
    </div>

    <div class="split">
      <div class="card">
        <h2 style="margin-top:0">Profile</h2>
        <p class="muted" style="margin-top:-6px">Each axis is this character's
          percentile among the ${QUAL.length} with ${scopeMin()}+ matches${
          provisional ? `, plus ${p.name}` : ""} — the outer ring is the highest
          value in the pool. Read each spoke on its own.</p>
        ${radarSVG(profile, col, 300)}
        <p class="muted" style="margin-top:10px">${PROFILE_KEY}. All per minute
          played.</p>
      </div>

      <div class="card">
        <h2 style="margin-top:0">Rates, against the field</h2>
        <p class="muted" style="margin-top:-6px">Bar shows the percentile among the
          ${QUAL.length} characters with ${scopeMin()}+ matches${
          provisional ? `, plus ${p.name}` : ""}. Per game reorders the board:
          short rounds flatter a per-minute rate.</p>
        <div class="units">${UNITS.map(([u, lab]) =>
          `<button type="button" data-unit="${u}"${u === unit ? ' class="on"' : ""}
           >${lab}</button>`).join("")}</div>
        <table><thead><tr><th>Statistic</th>
          <th class="n">${(UNITS.find(u => u[0] === unit) || UNITS[0])[1]}</th>
          <th class="barcell">percentile</th><th class="n">rank</th>
          ${useClass ? `<th class="n">vs ${p.class}s</th>` : ""}</tr></thead><tbody>
        ${rows.map(r => `<tr>
          <td>${LBL[r.k] || r.k}</td>
          <td class="n">${SEC.has(r.k) ? dur(r.v)
                          : r.v >= 100 ? fmt(r.v) : r.v.toFixed(2)}</td>
          <td class="barcell"><div class="bar"><span style="width:${
              ((r.r?.pctile||0)*100).toFixed(0)}%;background:${col}"></span></div></td>
          <td class="n">${r.r ? "#"+r.r.rank : "–"}</td>
          ${useClass ? `<td class="n">${r.rc ? "#"+r.rc.rank+" of "+r.rc.of : "–"}</td>` : ""}
        </tr>`).join("")}
        </tbody></table>
        ${useClass ? "" : `<p class="muted">Too few ${p.class || "same-class"}
          characters with ${scopeMin()}+ matches for a class ranking.</p>`}
      </div>

    </div>

    <div class="split">
      <div class="card">
        <h2 style="margin-top:0">Personal bests</h2>
        <p class="muted" style="margin-top:-6px">Best single match in the period.</p>
        <table><tbody>
        ${bests.map(([k,v]) => `<tr><td>${LBL[k]||k}</td>
          <td class="n">${statVal(k,v)}</td></tr>`).join("")}
        </tbody></table>
      </div>

      <div class="card">
        <h2 style="margin-top:0">Contested vs thin lobbies</h2>
        <p class="muted" style="margin-top:-6px">Contested = both teams fielded
          ${META.contestedPerTeam}+ real players; thin = ${META.thinPerTeam} or fewer.</p>
        ${p.scoped ? `<p class="muted">This compares the two kinds of lobby across
          the whole period, so it does not narrow to ${scopeDef().label.toLowerCase()}.
          Switch back to all time to see it.</p>`
        : `<table><tbody>
          <tr><td>Contested lobbies</td><td class="n">${pct(p.contestedWr)}</td>
              <td class="n muted">${p.contestedN} matches</td></tr>
          <tr><td>Thin lobbies</td><td class="n">${pct(p.thinWr)}</td>
              <td class="n muted">${p.thinN} matches</td></tr>
        </tbody></table>`}

        <h2>Other rates</h2>
        <table><tbody>
          <tr><td>Damage taken per death</td><td class="n">${fmt(p.takenPerDeath)}</td></tr>
          <tr><td>Damage aimed at the enemy carrier</td>
              <td class="n">${pct(p.objDamage)}</td></tr>
          <tr><td>Healing aimed at own carrier</td>
              <td class="n">${pct(p.objHealing)}</td></tr>
          <tr><td>Matches left early</td><td class="n">${pct(p.desertRate)}</td></tr>
        </tbody></table>
      </div>
    </div>

    <div class="split">
      <div class="card">
        <h2 style="margin-top:0">Faced most often</h2>
        <p class="muted" style="margin-top:-6px">Record against opponents met at
          least 6 times, most-played first.</p>
        ${p.rivals.length ? `<table><thead><tr><th>Opponent</th><th class="n">W–L</th>
          <th class="n">rate</th></tr></thead><tbody>
          ${p.rivals.map(([n,wn,ls]) => `<tr><td>${n}</td>
            <td class="n">${wn}–${ls}</td>
            <td class="n">${pct(wn/(wn+ls))}</td></tr>`).join("")}
          </tbody></table>` : `<p class="muted">${p.scoped ? "Head-to-head records are only kept for the whole period." : "Nobody met often enough yet."}</p>`}
      </div>

      <div class="card">
        <h2 style="margin-top:0">Played alongside</h2>
        <p class="muted" style="margin-top:-6px">Record with team mates shared at
          least 8 times, most-played first.</p>
        ${p.allies.length ? `<table><thead><tr><th>Team mate</th><th class="n">W–L</th>
          <th class="n">rate</th></tr></thead><tbody>
          ${p.allies.map(([n,wn,ls]) => `<tr><td>${n}</td>
            <td class="n">${wn}–${ls}</td>
            <td class="n">${pct(wn/(wn+ls))}</td></tr>`).join("")}
          </tbody></table>` : `<p class="muted">${p.scoped ? "Team-mate records are only kept for the whole period." : "No regular team mates yet."}</p>`}
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">Game log</h2>
      <p class="muted" style="margin-top:-6px">Every recorded match, newest first.
        Click a column to sort.</p>
      <div class="logwrap" id="logwrap"></div>
    </div>`;
  renderLog(log);
  el.dataset.player = p.name;
  el.classList.remove("hidden");
  el.querySelector("#closeCard").onclick = clearPlayer;
  el.querySelectorAll(".units button").forEach(b => b.onclick = () => {
    unit = b.dataset.unit;
    show(p);                       // same character, rates read the other way
  });
  el.scrollIntoView({behavior:"smooth", block:"start"});
}

/* Back to the report without a character on screen. Clears the address too, so
   a reload or a share does not drop the reader back onto someone's card. */
function clearPlayer(){
  const el = document.getElementById("card");
  el.classList.add("hidden");
  el.dataset.player = "";
  q.value = "";
  hits.innerHTML = "";
  if (location.hash) history.pushState(null, "", location.pathname + location.search);
  // Back to the search box, which is where the reader starts from.
  document.querySelector("h1").scrollIntoView({behavior: "smooth", block: "start"});
  q.focus();
}

/* ---------- game log table ---------- */
const LOG_COLS = [
  ["Date",     r => dateOf(r[LF.at]),                        r => r[LF.at]],
  ["Result",   r => resultCell(r),                           r => r[LF.win]],
  ["Score",    r => `${r[LF.ownCaps]}–${r[LF.oppCaps]}`,     r => r[LF.ownCaps]-r[LF.oppCaps]],
  ["Time",     r => dur(r[LF.seconds]),                      r => r[LF.seconds]],
  ["Damage",   r => fmt(r[LF.damageDone]),                   r => r[LF.damageDone]],
  ["Healing",  r => fmt(r[LF.healingDone]),                  r => r[LF.healingDone]],
  ["On EFC",   r => fmt(r[LF.damageOnEFC]),                  r => r[LF.damageOnEFC]],
  ["Caps",     r => r[LF.flagCaptures] || "",                r => r[LF.flagCaptures]],
  ["Returns",  r => r[LF.flagReturns] || "",                 r => r[LF.flagReturns]],
  ["Carried",  r => r[LF.flagCarryTime] ? dur(r[LF.flagCarryTime]) : "", r => r[LF.flagCarryTime]],
  ["KB",       r => r[LF.killingBlows] || "",                r => r[LF.killingBlows]],
  ["Deaths",   r => r[LF.deaths] || "",                      r => r[LF.deaths]],
];
function resultCell(r){
  const v = r[LF.win];
  const t = v > 0 ? "Win" : v < 0 ? "Loss" : "Draw";
  const left = r[LF.deserted] ? ` <span class="pill">left</span>` : "";
  return `<span class="res ${v>0?"w":v<0?"l":""}">${t}</span>${left}`;
}
let logRows = [], logSort = {col: 0, dir: -1};
function renderLog(rows){
  logRows = rows.slice();
  logSort = {col: 0, dir: -1};              // newest first
  drawLog();
}
function drawLog(){
  const {col, dir} = logSort;
  const key = LOG_COLS[col][2];
  const sorted = logRows.slice().sort((a, b) => (key(a) - key(b)) * dir);
  document.getElementById("logwrap").innerHTML =
    `<table><thead><tr>${LOG_COLS.map((c, i) =>
       `<th class="${i ? "n" : ""}" data-c="${i}">${c[0]}${
          i === col ? (dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead>
     <tbody>${sorted.map(r => `<tr>${LOG_COLS.map((c, i) =>
       `<td class="${i ? "n" : ""}">${c[1](r)}</td>`).join("")}</tr>`).join("")}
     </tbody></table>`;
  document.querySelectorAll("#logwrap th").forEach(th => th.onclick = () => {
    const i = +th.dataset.c;
    logSort = {col: i, dir: logSort.col === i ? -logSort.dir : -1};
    drawLog();
  });
}

/* ---------- report gallery ---------- */
const gal = document.getElementById("gal");
const nav = document.getElementById("galnav");
const chartStem = f => f.replace(/\.png$/, "");
const chartInfo = f => (DATA.chartInfo || {})[chartStem(f)] || {};
// Falls back to the file name so a chart added without a description still shows.
const chartLabel = f => chartInfo(f).title
                     || f.replace(/^\d+_/, "").replace(/\.png$/, "").replace(/_/g, " ");
const chartBlurb = f => chartInfo(f).blurb || "";
const chartDir = () => (HAS_CONTESTED && !allLobbies && DATA.chartsContested.length)
                       ? "charts-contested" : "charts";
function renderGallery(){
  if (!CHARTS.length){
    gal.innerHTML = `<p class="muted">No chart images alongside this file.</p>`;
    return;
  }
  const dir = chartDir();
  const v = VIEWS.find(x => x.slug === view) || VIEWS[0];
  const secs = v ? v.sections : [{name: "", charts: CHARTS.map(chartStem)}];

  // The lightbox walks the page the reader is on, not all 44 charts: arrows
  // that carried on into a view they had not opened would be disorienting.
  LBSET = secs.flatMap(g => g.charts).map(st => st + ".png");

  const tile = stem => {
    const f = stem + ".png";
    return `<figure><a href="#" data-i="${LBSET.indexOf(f)}">
       <img loading="lazy" src="${dir}/${f}" alt="${chartLabel(f)}">
       <figcaption><b>${chartLabel(f)}</b><span>${chartBlurb(f)}</span></figcaption>
     </a></figure>`;
  };
  gal.innerHTML = secs.map((g, i) => `<section id="sec-${i}">
      ${g.name ? `<h3>${g.name}</h3>
      <p class="muted">${g.charts.length} chart${g.charts.length === 1 ? "" : "s"}</p>` : ""}
      <div class="gal-grid">${g.charts.map(tile).join("")}</div>
    </section>`).join("");

  // Buttons rather than links: a #hash here would collide with the character
  // routing and drop whoever is on screen.
  nav.innerHTML = secs.filter(g => g.name).map((g, i) =>
    `<button data-sec="${i}">${g.name}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () =>
    document.getElementById(`sec-${b.dataset.sec}`)
            .scrollIntoView({behavior: "smooth", block: "start"}));

  gal.querySelectorAll("figure a").forEach(a => a.onclick = e => {
    e.preventDefault(); openLightbox(+a.dataset.i);
  });
}

/* ---------- lightbox: click a chart, then arrow through the set ---------- */
let lbIndex = 0, lbEl = null, LBSET = [];
function openLightbox(i){
  lbIndex = i;
  if (!lbEl){
    lbEl = document.createElement("div");
    lbEl.className = "lb";
    lbEl.innerHTML = `<img alt=""><div class="cap"></div>
      <button class="prev" aria-label="Previous chart">‹</button>
      <button class="next" aria-label="Next chart">›</button>
      <button class="close" aria-label="Close">✕</button>`;
    lbEl.querySelector(".prev").onclick = e => { e.stopPropagation(); stepLightbox(-1); };
    lbEl.querySelector(".next").onclick = e => { e.stopPropagation(); stepLightbox(1); };
    lbEl.querySelector(".close").onclick = closeLightbox;
    // Clicking the backdrop closes; clicking the image itself must not.
    lbEl.onclick = e => { if (e.target === lbEl) closeLightbox(); };
    lbEl.querySelector("img").onclick = () => stepLightbox(1);
    document.body.appendChild(lbEl);
  }
  lbEl.style.display = "flex";
  document.body.style.overflow = "hidden";
  drawLightbox();
}
function drawLightbox(){
  const f = LBSET[lbIndex];
  lbEl.querySelector("img").src = `${chartDir()}/${f}`;
  lbEl.querySelector(".cap").innerHTML =
    `<b>${chartLabel(f)}</b> — ${lbIndex + 1} of ${LBSET.length}` +
    (chartBlurb(f) ? `<span>${chartBlurb(f)}</span>` : "");
}
function stepLightbox(d){
  lbIndex = (lbIndex + d + LBSET.length) % LBSET.length;     // wraps both ways
  drawLightbox();
}
function closeLightbox(){
  if (lbEl) lbEl.style.display = "none";
  document.body.style.overflow = "";
}
document.addEventListener("keydown", e => {
  if (!lbEl || lbEl.style.display === "none"){
    if (e.key === "Escape" && !document.getElementById("card").classList.contains("hidden"))
      clearPlayer();
    return;
  }
  if (e.key === "ArrowRight") stepLightbox(1);
  else if (e.key === "ArrowLeft") stepLightbox(-1);
  else if (e.key === "Escape") closeLightbox();
});
// Swipe on touch devices.
let touchX = null;
document.addEventListener("touchstart", e => {
  if (lbEl && lbEl.style.display !== "none") touchX = e.changedTouches[0].clientX;
}, {passive: true});
document.addEventListener("touchend", e => {
  if (touchX == null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 45) stepLightbox(dx < 0 ? 1 : -1);
  touchX = null;
}, {passive: true});

document.getElementById("period").textContent =
  `${META.matches} matches · ${META.characters} characters · ${META.periodLabel}`;
// The site name is the way home: press it and the report is back, no character.
/* ---------- the gallery pages ----------
   One HTML file, several views. Separate files would each need their own copy
   of the inlined payload, and the character search would only work on one of
   them; hidden views cost nothing here because their images are lazy and never
   requested until the view is opened. */
let view = "boards";
const viewNav = document.getElementById("viewnav");
function renderViewNav(){
  viewNav.innerHTML = VIEWS.map(v =>
    `<button type="button" data-view="${v.slug}"${v.slug === view ? ' class="on"' : ""}
     >${v.label}</button>`).join("");
  viewNav.querySelectorAll("button").forEach(b => b.onclick = () => setView(b.dataset.view));
}
function setView(slug, {push = true} = {}){
  if (!VIEWS.some(v => v.slug === slug)) return;
  view = slug;
  const hash = "#/" + slug;
  if (push && location.hash !== hash) history.pushState(null, "", hash);
  renderViewNav();
  renderGallery();
  closeLightbox();
}

/* ---------- the time-window switch ---------- */
const scopeBar = document.getElementById("scopeBar");
function renderScopeBar(){
  // The charts are rendered once per build over the whole period. Say so when a
  // window is on, or the reader takes "Today" to apply to the pictures as well.
  const g = document.getElementById("galScope");
  g.textContent = scopeCut() == null ? ""
    : `The charts below always cover the whole period — ${scopeDef().label.toLowerCase()} `
      + "applies to the character search and its boards, not to the rendered images.";
  scopeBar.innerHTML = SCOPES.map(sc =>
    `<button type="button" data-scope="${sc.id}"${sc.id === scope ? ' class="on"' : ""}
     >${sc.label}</button>`).join("");
  scopeBar.querySelectorAll("button").forEach(b => b.onclick = () => {
    scope = b.dataset.scope;
    applyScope();
    renderScopeBar();
    updateNote();
    // Whoever is on screen is redrawn from the new window, or dropped if they
    // did not play in it at all.
    const shown = document.getElementById("card").dataset.player;
    if (shown){
      const p = P.find(x => x.name === shown);
      if (p) show(p); else clearPlayer();
    }
  });
}

document.getElementById("home").onclick = () => {
  if (document.getElementById("card").classList.contains("hidden"))
    document.querySelector("h1").scrollIntoView({behavior: "smooth", block: "start"});
  else clearPlayer();
};

/* ---------- the lobby switch ---------- */
const box = document.getElementById("allLobbies");
if (!HAS_CONTESTED) box.closest(".switch").style.display = "none";
box.onchange = () => {
  allLobbies = box.checked;
  applyScope();
  renderViewNav();
  updateNote();
  renderGallery();
  closeLightbox();
  // Redraw whatever character is on screen, now from the other slice.
  const shown = document.getElementById("card").dataset.player;
  if (shown){
    const p = P.find(x => x.name === shown);
    if (p) show(p); else document.getElementById("card").classList.add("hidden");
  }
};

/* ---------- deep links: #/c/Name ----------
   A character view is a page in its own right: linkable, bookmarkable, and
   countable. Without this the whole site is one URL and no analytics can tell
   a visitor who read one character from one who read thirty. */
const charHash = name => "#/c/" + encodeURIComponent(name);
// The address bar needs percent-encoding; the analytics dashboard does not, and
// "/c/Téch (Priest)" reads better there than "/c/T%C3%A9ch%20(Priest)".
const charPath = name => "/c/" + name.replace(/\//g, "-");

function countView(path, title){
  // No-op until an analytics script is configured at build time.
  if (window.goatcounter && window.goatcounter.count)
    window.goatcounter.count({path: path, title: title, event: false});
}

function nameFromHash(){
  const h = location.hash.replace(/^#/, "");
  if (!h.startsWith("/c/")) return "";
  try { return decodeURIComponent(h.slice(3)); } catch (e) { return h.slice(3); }
}
// A view and a character are both addressable, and independent: opening someone
// leaves the gallery on whatever page was already showing.
function viewFromHash(){
  const h = location.hash.replace(/^#\//, "");
  return VIEWS.some(v => v.slug === h) ? h : "";
}

function openPlayer(p){
  const hash = charHash(p.name);
  if (location.hash !== hash) history.pushState(null, "", hash);
  show(p);
  countView(charPath(p.name), p.name);
}

function route(){
  const card = document.getElementById("card");
  const v = viewFromHash();
  if (v){
    card.classList.add("hidden");
    if (v !== view) setView(v, {push: false});
    return;
  }
  const name = nameFromHash();
  if (!name){ card.classList.add("hidden"); return; }

  let p = P.find(x => x.name === name);
  if (!p && HAS_CONTESTED){
    // A link can point at someone with no matches in the current slice - a
    // character who never played a contested lobby. Follow the link rather
    // than showing nothing, and move the switch so the view stays honest.
    const other = (allLobbies ? DATA.playersContested : DATA.players);
    if (other.some(x => x.name === name)){
      box.checked = allLobbies = !allLobbies;
      applyScope(); updateNote(); renderGallery();
      p = P.find(x => x.name === name);
    }
  }
  if (!p){ card.classList.add("hidden"); return; }
  if (card.dataset.player === p.name && !card.classList.contains("hidden")) return;
  q.value = p.name;
  hits.innerHTML = "";
  show(p);
  countView(charPath(p.name), p.name);
}

window.addEventListener("hashchange", route);

applyScope();
view = viewFromHash() || view;
renderViewNav();
renderScopeBar();
updateNote();
renderGallery();
route();

document.getElementById("foot").textContent =
  `Source: 19pvp export ${META.source} · generated ${META.generated}. `
  + `Bots are not in the export, so recorded players are the real ones.`;
</script>
